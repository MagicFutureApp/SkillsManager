appId: app.magicfuture.skillsmanager
productName: Skills Manager

directories:
  app: apps/desktop
  output: apps/desktop/release

files:
  - dist/**/*
  - package.json

asar: true
npmRebuild: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: apps/desktop/src/renderer/assets/macOS/1024.png
  artifactName: skills-manager-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: apps/desktop/src/renderer/assets/macOS/1024.png
  category: public.app-category.developer-tools
  identity: null
  artifactName: skills-manager-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: deb
      arch:
        - x64
  icon: apps/desktop/src/renderer/assets/macOS
  category: Development
  executableName: skills-manager
  maintainer: MagicFuture
  syncDesktopName: true
  artifactName: skills-manager-${version}-ubuntu-${arch}.${ext}

deb:
  packageCategory: devel
